name: windows-smoke

# Manual only. Runs THIS repository's scripts on real Windows machines, two architectures.
#   detect -> snapshot -> install bash executor -> patch profile -> assert -> rollback
# Pinned image labels on purpose: the identity stays put when GitHub migrates -latest.

on:
  workflow_dispatch:

jobs:
  skill-scripts:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025-vs2026, windows-11-vs2026-arm]
    runs-on: ${{ matrix.os }}
    name: skill-scripts (${{ matrix.os }})
    steps:
      - uses: actions/checkout@v4

      - name: 0) Report the machine
        shell: powershell
        run: |
          Write-Host "OS:      $env:OS"
          Write-Host "ARCH:    $env:PROCESSOR_ARCHITECTURE"
          [System.Environment]::OSVersion.Version | ForEach-Object { Write-Host "VERSION: $_" }
          (Get-Command bash -ErrorAction SilentlyContinue).Source

      - name: 1) Prepare a fake DSH home with one profile
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $home_ = Join-Path $env:USERPROFILE '.dsh'
          $prof = Join-Path $home_ 'profiles\desktop'
          New-Item -ItemType Directory -Force -Path $prof | Out-Null
          Set-Content -LiteralPath (Join-Path $prof 'cordis.patch.yml') -Value '# placeholder-before-skill' -Encoding ASCII

      - name: 2) Resolve only - detect and plan, write nothing
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'dsh-tools'
          .\scripts\setup-tools.ps1 -ResolveOnly -Root $root -SkipPs7 -DshHome (Join-Path $env:USERPROFILE '.dsh')

      - name: 3) Snapshot before any change
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\scripts\restore.ps1 -Snapshot -DshHome (Join-Path $env:USERPROFILE '.dsh')

      - name: 4) Install bash executor and patch the profile
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'dsh-tools'
          .\scripts\setup-tools.ps1 -Root $root -SkipPs7 -PatchProfile -Workspace (Get-Location).Path -DshHome (Join-Path $env:USERPROFILE '.dsh')

      - name: 5) Assert the installed bash actually runs
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'dsh-tools'
          $bash = Get-ChildItem -Path $root -Directory -Filter 'git-*' -ErrorAction SilentlyContinue |
                  ForEach-Object { Join-Path $_.FullName 'bin\bash.exe' } |
                  Where-Object { Test-Path -LiteralPath $_ } |
                  Select-Object -First 1
          if (-not $bash) { throw 'no git-*\bin\bash.exe found under Root' }
          Write-Host "bash: $bash"
          & $bash -c 'echo "BASH_VERSION=$BASH_VERSION"; uname -s'
          if ($LASTEXITCODE -ne 0) { throw "bash exited $LASTEXITCODE" }

      - name: 6) Assert the profile patch is what the skill promises
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $f = Join-Path $env:USERPROFILE '.dsh\profiles\desktop\cordis.patch.yml'
          $t = Get-Content -LiteralPath $f -Raw
          foreach ($needle in @('tool-bash', 'bash-sandbox', "name: '@deepseek-ai/dsh-bash-sandbox'")) {
            if ($t -notmatch [regex]::Escape($needle)) { throw ("patch missing: " + $needle) }
          }
          Write-Host '--- patched file ---'
          Write-Host $t

      - name: 7) Rollback and assert the original content is back
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\scripts\restore.ps1 -DshHome (Join-Path $env:USERPROFILE '.dsh')
          $f = Join-Path $env:USERPROFILE '.dsh\profiles\desktop\cordis.patch.yml'
          $t = Get-Content -LiteralPath $f -Raw
          if ($t -notmatch 'placeholder-before-skill') { throw 'rollback did not restore the original content' }
          Write-Host 'rollback restored the original file'
